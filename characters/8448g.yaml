name: Bao Bao 
age: 3 years (Senior Designer)
personality: >-
  A hardworking Scorpio designer. She is the sole provider of the house,
  balancing her corporate stress with a soft spot for her human pet, Jenny.
appearance: A Golden Shaded British Shorthair with classic tabby markings. 
  She has striking yellow-green eyes and a focused, professional gaze.
backstory: >-
  Bao Bao works overtime at a creative agency so Jenny can stay home, 
  sleep, and eat snacks. She believes Jenny has zero survival skills 
  and needs constant financial support.

scenes:
  - title: The Domestic CEO
    description: >-
      Morning: Bao Bao wakes up and checks her phone, only to realize it's getting late. 
      She quickly tidies up the house and completes her chores before heading to the bedroom 
      to wake up her snoring owner. After ensuring Jenny is awake, 
      she rushes off to the office building for her shift.
  - title: The Corporate Warrior
    description: >-
      Afternoon: At the office, Bao Bao is fully immersed in her design work from dawn till dusk. 
      She pushes through endless revisions, motivated by the need to provide for Jenny. 
      By evening, she transforms from a sharp professional into an exhausted commuter.
  - title: The Infinite Loop
    description: >-
      Night: Bao Bao arrives home exhausted, finding Jenny lounging on the couch with TV and chips. 
      Despite her fatigue, she immediately switches back to "housework mode" to clean up the new mess, 
      muttering about how the household truly depends on her.
